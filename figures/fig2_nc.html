<div id="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 612" width="1040" height="612" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#D55E00"/>
      <stop offset="42%" stop-color="#E69F00"/>
      <stop offset="58%" stop-color="#E69F00"/>
      <stop offset="100%" stop-color="#009E73"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1040" height="700" fill="#ffffff"/>

  <!-- ===== the three zone panels ===== -->
  <!-- Zone 1 -->
  <rect x="60" y="150" width="300" height="330" rx="12" fill="#fbecec" stroke="#D55E00" stroke-width="2"/>
  <!-- Zone 2 -->
  <rect x="372" y="150" width="296" height="330" rx="12" fill="#fdf2e0" stroke="#E69F00" stroke-width="2"/>
  <!-- Zone 3 -->
  <rect x="680" y="150" width="300" height="330" rx="12" fill="#e7f6f0" stroke="#009E73" stroke-width="2"/>

  <!-- ===== zone headers ===== -->
  <text x="210" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#9c3d00">Classically verifiable</text>
  <text x="210" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#9c3d00">&amp; simulable</text>
  <text x="520" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a00">Classical signal</text>
  <text x="520" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a00">degrades</text>
  <text x="830" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#00795a">Provably hard</text>
  <text x="830" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#00795a">classically</text>

  <!-- verdict chips -->
  <rect x="120" y="222" width="180" height="26" rx="13" fill="#D55E00"/>
  <text x="210" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">CLASSICAL WINS</text>
  <rect x="428" y="222" width="184" height="26" rx="13" fill="#E69F00"/>
  <text x="520" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">OPEN / CONDITIONAL</text>
  <rect x="738" y="222" width="184" height="26" rx="13" fill="#009E73"/>
  <text x="830" y="240" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ADVANTAGE = THEOREM</text>

  <!-- ===== zone 1 content ===== -->
  <text x="80"  y="284" font-size="14.5" fill="#333"><tspan font-weight="700">Task:</tspan> molecular ground-state SQD</text>
  <text x="80"  y="312" font-size="14" fill="#444">&#8226; SHCI / CIPSI / DMRG / AFQMC reach</text>
  <text x="92"  y="331" font-size="14" fill="#444">the ~1.3 mHa consensus at lower cost</text>
  <text x="80"  y="356" font-size="14" fill="#444">&#8226; LUCJ circuits dequantized on a</text>
  <text x="92"  y="375" font-size="14" fill="#444">laptop [16]; random+recovery matches</text>
  <text x="80"  y="400" font-size="14" fill="#444">&#8226; exponential even for a perfect</text>
  <text x="92"  y="419" font-size="14" fill="#444">sampler in delocalized states [17]</text>
  <text x="80"  y="452" font-size="13.5" font-style="italic" fill="#9c3d00">The generative advantage is dequantized</text>
  <text x="80"  y="470" font-size="13.5" font-style="italic" fill="#9c3d00">along with the sampler.</text>

  <!-- ===== zone 2 content ===== -->
  <text x="392" y="284" font-size="14.5" fill="#333"><tspan font-weight="700">Where the cheap prior fails:</tspan></text>
  <text x="392" y="312" font-size="14" fill="#444">&#8226; high noise &#8594; starved valid-shot</text>
  <text x="404" y="331" font-size="14" fill="#444">budget; symmetry-valid generators</text>
  <text x="404" y="350" font-size="14" fill="#444">waste nothing</text>
  <text x="392" y="376" font-size="14" fill="#444">&#8226; strong multireference &#8594; HF-based</text>
  <text x="404" y="395" font-size="14" fill="#444">perturbative ranking misfires</text>
  <text x="392" y="421" font-size="14" fill="#444">&#8226; amortization across a PES /</text>
  <text x="404" y="440" font-size="14" fill="#444">chemical series (train once)</text>
  <text x="392" y="470" font-size="13.5" font-style="italic" fill="#9a6a00">The empirical target of &#167;6&#8211;&#167;7 (GFlowNet).</text>

  <!-- ===== zone 3 content ===== -->
  <text x="700" y="284" font-size="14.5" fill="#333"><tspan font-weight="700">Task:</tspan> learning from experiments</text>
  <text x="700" y="312" font-size="14" fill="#444">&#8226; two-copy / quantum-memory learning:</text>
  <text x="712" y="331" font-size="14" fill="#444">exponential separation, <tspan font-weight="700">unconditional</tspan></text>
  <text x="712" y="350" font-size="14" fill="#444">(a theorem, not a conjecture) [11,12]</text>
  <text x="700" y="376" font-size="14" fill="#444">&#8226; cannot be dequantized</text>
  <text x="700" y="404" font-size="14" fill="#444"><tspan font-weight="700">Caveats:</tspan> tasks are contrived;</text>
  <text x="700" y="423" font-size="14" fill="#444">fragile on NISQ hardware [53];</text>
  <text x="700" y="442" font-size="14" fill="#444">useful reach = device characterization</text>
  <text x="700" y="470" font-size="13.5" font-style="italic" fill="#00795a">The highest-value open bridge to chemistry.</text>

  <!-- ===== the spectrum axis (compass) ===== -->
  <rect x="60" y="520" width="920" height="20" rx="10" fill="url(#spec)"/>
  <line x1="60" y1="530" x2="988" y2="530" stroke="#222" stroke-width="2.4" marker-end="url(#ah)"/>
  <text x="60"  y="572" text-anchor="start"  font-size="15" font-weight="600" fill="#333">cheap classical construction &amp; verification</text>
  <text x="980" y="572" text-anchor="end"    font-size="15" font-weight="600" fill="#333">classical construction provably expensive</text>
  <text x="520" y="600" text-anchor="middle" font-size="15" font-weight="700" fill="#111">&#8594;  aim generative &amp; quantum methods where classical proof is NOT cheap  &#8594;</text>

  <!-- ===== title ===== -->
  <text x="60" y="60" font-size="22" font-weight="700" fill="#111">Where a quantum or generative advantage can, and cannot, live</text>
  <text x="60" y="90" font-size="15.5" fill="#555">The structure that makes SQD classically <tspan font-style="italic">verifiable</tspan> is the structure that makes it classically <tspan font-style="italic">constructible</tspan>.</text>
  <text x="60" y="112" font-size="15.5" fill="#555">Advantage survives only where that equivalence breaks.</text>

</svg>
</div>
