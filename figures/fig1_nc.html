<div id="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1000" width="1040" height="1000" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#222"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E69F00"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8256B4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1180" fill="#ffffff"/>

  <!-- ===== column band backgrounds ===== -->
  <!-- quantum band -->
  <rect x="70" y="150" width="420" height="330" rx="14" fill="#eaf3f9" stroke="none"/>
  <text x="86" y="176" font-size="15" font-weight="700" fill="#0072B2" letter-spacing="1.5">QUANTUM PROCESSOR</text>
  <!-- classical band -->
  <rect x="70" y="500" width="420" height="500" rx="14" fill="#f3eef7" stroke="none"/>
  <text x="86" y="526" font-size="15" font-weight="700" fill="#8256B4" letter-spacing="1.5">CLASSICAL CO-PROCESSOR</text>

  <!-- ===== NODES ===== -->
  <!-- node 1: Hamiltonian -->
  <g>
    <rect x="110" y="40" width="340" height="78" rx="10" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <text x="280" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#111">Molecular Hamiltonian</text>
    <text x="280" y="98" text-anchor="middle" font-size="15" fill="#444">active space (n&#8337;, n&#8338;) &#183; HF / natural orbitals</text>
  </g>
  <!-- node 2: LUCJ -->
  <g>
    <rect x="110" y="196" width="340" height="90" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2.5"/>
    <text x="280" y="228" text-anchor="middle" font-size="18" font-weight="700" fill="#0a4a72">State preparation</text>
    <text x="280" y="252" text-anchor="middle" font-size="15" fill="#444">LUCJ / UCJ ansatz &#183; time-evolution</text>
    <text x="280" y="272" text-anchor="middle" font-size="15" fill="#444">(ADAPT / Krylov variants)</text>
  </g>
  <!-- node 3: measurement -->
  <g>
    <rect x="110" y="366" width="340" height="90" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2.5"/>
    <text x="280" y="398" text-anchor="middle" font-size="18" font-weight="700" fill="#0a4a72">Projective measurement</text>
    <text x="280" y="422" text-anchor="middle" font-size="15" fill="#444">sampled bitstrings {x} &#8712; comp. basis</text>
    <text x="280" y="442" text-anchor="middle" font-size="14.5" font-style="italic" fill="#b34700">noisy &#8594; particle-number violations</text>
  </g>
  <!-- node 4: recovery -->
  <g>
    <rect x="110" y="540" width="340" height="90" rx="10" fill="#ffffff" stroke="#8256B4" stroke-width="2.5"/>
    <text x="280" y="572" text-anchor="middle" font-size="18" font-weight="700" fill="#5a2e86">Configuration recovery</text>
    <text x="280" y="596" text-anchor="middle" font-size="15" fill="#444">S-CORE: project to valid N,</text>
    <text x="280" y="616" text-anchor="middle" font-size="15" fill="#444">reweight by mean occupations</text>
  </g>
  <!-- node 5: subspace -->
  <g>
    <rect x="110" y="700" width="340" height="78" rx="10" fill="#ffffff" stroke="#8256B4" stroke-width="2.5"/>
    <text x="280" y="732" text-anchor="middle" font-size="18" font-weight="700" fill="#5a2e86">Determinant subspace  &#119982;</text>
    <text x="280" y="758" text-anchor="middle" font-size="15" fill="#444">batches of unique configurations</text>
  </g>
  <!-- node 6: diagonalization -->
  <g>
    <rect x="110" y="848" width="340" height="90" rx="10" fill="#ffffff" stroke="#8256B4" stroke-width="2.5"/>
    <text x="280" y="880" text-anchor="middle" font-size="18" font-weight="700" fill="#5a2e86">Exact diagonalization</text>
    <text x="280" y="906" text-anchor="middle" font-size="16" fill="#444">H|&#8339; &#8594; E&#8320; , 1-/2-RDMs</text>
    <text x="280" y="926" text-anchor="middle" font-size="14.5" fill="#444">(+ PT2 / AFQMC / embedding)</text>
  </g>

  <!-- ===== main flow arrows ===== -->
  <line x1="280" y1="118" x2="280" y2="192" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="280" y1="286" x2="280" y2="362" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="280" y1="456" x2="280" y2="536" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="280" y1="630" x2="280" y2="696" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="280" y1="778" x2="280" y2="844" stroke="#222" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- measurement->recovery label -->
  <text x="292" y="500" font-size="13.5" fill="#666" font-style="italic">shots &#8594; frequencies</text>

  <!-- ===== feedback loop (green) node6 -> node4 ===== -->
  <path d="M110 893 C 40 893, 40 585, 108 585" fill="none" stroke="#009E73" stroke-width="2.4" marker-end="url(#arrG)"/>
  <text x="30" y="735" font-size="13.5" fill="#00795a" font-weight="600" transform="rotate(-90 30 735)" text-anchor="middle">self-consistent occupations (S-CORE loop)</text>

  <!-- ===== ML ENTRY POINT A : circuit design (orange) ===== -->
  <g>
    <rect x="560" y="188" width="452" height="106" rx="10" fill="#fdf2e0" stroke="#E69F00" stroke-width="2.2"/>
    <text x="584" y="214" font-size="14" font-weight="700" fill="#9a6a00" letter-spacing="1">ML ENTRY &#9312; &#8212; DESIGN THE SAMPLER</text>
    <text x="584" y="240" font-size="15" fill="#333">Generative circuit design: GQE / GPT-QE,</text>
    <text x="584" y="262" font-size="15" fill="#333">Generative-QSCI (transformer policy) &#8212; learns</text>
    <text x="584" y="284" font-size="15" fill="#333">circuits that emit better subspaces  [33,34]</text>
  </g>
  <path d="M450 241 L556 241" fill="none" stroke="#E69F00" stroke-width="2.4" marker-end="url(#arrO)"/>

  <!-- ===== ML ENTRY POINT B : recovery/selection (purple) ===== -->
  <g>
    <rect x="560" y="470" width="452" height="270" rx="10" fill="#f3ecfa" stroke="#8256B4" stroke-width="2.2"/>
    <text x="584" y="496" font-size="14" font-weight="700" fill="#5a2e86" letter-spacing="1">ML ENTRY &#9313; &#8212; GENERATE / SELECT CONFIGURATIONS</text>

    <text x="584" y="528" font-size="15" fill="#333"><tspan font-weight="700">Generative models of |&#968;|&#178;:</tspan></text>
    <text x="600" y="550" font-size="14.5" fill="#333">&#8226; RBM / Born machines &#8212; PIGen-SQD, QSCI-RBM  [6,24]</text>
    <text x="600" y="571" font-size="14.5" fill="#333">&#8226; Autoregressive NQS in the loop &#8212; HI-NQS,</text>
    <text x="612" y="591" font-size="14.5" fill="#333">NQS-SC, QiankunNet  [26&#8211;29]</text>

    <text x="584" y="622" font-size="15" fill="#333"><tspan font-weight="700">Discriminative / ranking:</tspan></text>
    <text x="600" y="644" font-size="14.5" fill="#333">&#8226; NN classifier + active learning &#8212; cSQD  [30]</text>
    <text x="600" y="665" font-size="14.5" fill="#333">&#8226; Coupling-gated / learning-to-rank &#8212; HAAR, RCI  [31,32]</text>

    <text x="584" y="697" font-size="15" fill="#8256B4"><tspan font-weight="700">Reward-proportional sampler (whitespace):</tspan></text>
    <text x="600" y="719" font-size="14.5" fill="#8256B4">&#8226; GFlowNet &#8212; symmetry-valid by construction  [&#167;4.6]</text>
  </g>
  <path d="M450 585 L556 585" fill="none" stroke="#8256B4" stroke-width="2.4" marker-end="url(#arrP)"/>

  <!-- ===== bottleneck callout on subspace/recovery ===== -->
  <g>
    <rect x="560" y="820" width="452" height="118" rx="10" fill="#fbecec" stroke="#D55E00" stroke-width="2.2"/>
    <text x="584" y="846" font-size="14" font-weight="700" fill="#9c3d00" letter-spacing="1">THE BOTTLENECK  (&#167;3)</text>
    <text x="584" y="872" font-size="15" fill="#333">Coupon-collector scaling: rare-but-important</text>
    <text x="584" y="894" font-size="15" fill="#333">determinants need exponentially many shots.</text>
    <text x="584" y="916" font-size="15" fill="#333">Where ML must pay for itself &#8212; or not.</text>
  </g>
  <path d="M450 893 L556 893" fill="none" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr)"/>

</svg>
</div>
